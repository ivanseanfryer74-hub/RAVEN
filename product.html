<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVEN Product</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>RAVEN</h1>
<p>GOD DID</p>
</header>

<section class="product">

<h2>Classic Hoodie</h2>

<img src="images/classic-hoodie.jpg" alt="Classic Hoodie" width="300">

<h3>$45</h3>

<p>
Premium RAVEN hoodie made with high-quality fabric for comfort,
style, and durability.
</p>

<h4>Select Size</h4>

<select>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
</select>

<h4>Select Color</h4>

<select>
<option>Black</option>
<option>White</option>
<option>Red</option>
<option>Grey</option>
</select>

<br><br>

<label>Quantity</label>

<input type="number" value="1" min="1">

<br><br>

<button>Add To Cart</button>

<button>Add To Wishlist ❤</button>

<h3>Delivery</h3>

<p>
Estimated delivery: 3–7 business days.
</p>

</section>

</body>
</html>
